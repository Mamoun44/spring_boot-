$kind: http-request
name: Create Task
method: POST
url: '{{baseUrl}}/tasks'
description: Create a new task. Saves the task ID to a collection variable for use in subsequent requests.
order: 2000
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "title": "Test Task",
      "description": "A sample task for testing",
      "status": "TODO",
      "priority": "HIGH"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status code is 201", function () {
        pm.response.to.have.status(201);
      });

      pm.test("Response has task id", function () {
        const json = pm.response.json();
        pm.expect(json).to.have.property('id');
        pm.collectionVariables.set("taskId", json.id);
      });

      pm.test("Response has correct title", function () {
        const json = pm.response.json();
        pm.expect(json.title).to.eql("Test Task");
      });

      pm.test("Response has correct status", function () {
        const json = pm.response.json();
        pm.expect(json.status).to.eql("TODO");
      });

      pm.test("Response has correct priority", function () {
        const json = pm.response.json();
        pm.expect(json.priority).to.eql("HIGH");
      });
